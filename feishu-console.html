<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞书助理控制台 · SoloBrave</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1f2329; --sub: #646a73;
    --line: #e5e6eb; --ok: #00b42a; --bad: #f53f3f; --accent: #165dff;
    --warn-bg: #fff7e8; --warn-line: #ffcf8b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); padding: 20px 24px;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .desc { color: var(--sub); font-size: 12px; margin-bottom: 16px; }
  section {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 16px;
  }
  h2 { font-size: 14px; margin-bottom: 10px; color: var(--text); }
  .subnote { font-size: 12px; color: var(--sub); font-weight: normal; margin-left: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--sub); font-weight: 500; font-size: 12px; background: #fafbfc; }
  tr:last-child td { border-bottom: none; }
  td.r, th.r { text-align: right; }
  .empty { color: var(--sub); text-align: center; padding: 20px !important; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; }
  .on { background: #e8f8ee; color: var(--ok); }
  .off { background: #ffece8; color: var(--bad); }
  .gray { background: #f2f3f5; color: var(--sub); }
  .bal { font-weight: 600; }
  button {
    border: 1px solid var(--line); background: #fff; border-radius: 6px;
    padding: 3px 10px; cursor: pointer; font-size: 12px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .roles { display: flex; gap: 12px; flex-wrap: wrap; }
  .role-card {
    flex: 1; min-width: 220px; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px;
  }
  .role-card .name { font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .role-card .meta { font-size: 12px; color: var(--sub); margin-top: 6px; line-height: 1.7; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar select, .toolbar input {
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; background: #fff;
  }
  .toolbar button { padding: 6px 16px; background: var(--accent); color: #fff; border-color: var(--accent); }
  .toolbar button:disabled { opacity: .5; cursor: default; }
  .chat-list { max-height: 460px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
  .msg { max-width: 78%; border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
  .msg .time { display: block; font-size: 11px; color: var(--sub); margin-top: 4px; }
  .msg.in { align-self: flex-start; background: #f2f3f5; }
  .msg.out { align-self: flex-end; background: #e8f1ff; }
  .msg .mtype { font-size: 11px; color: var(--sub); margin-right: 6px; }
  .msg-empty { color: var(--sub); text-align: center; padding: 24px; font-size: 13px; }
  .msg-box {
    border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; display: none;
  }
  .msg-box.show { display: block; }
  .msg-box.warn { background: var(--warn-bg); border: 1px solid var(--warn-line); color: #b25e09; }
  .msg-box.err { background: #ffece8; border: 1px solid #fdcdc5; color: var(--bad); }
</style>
</head>
<body>

<h1>飞书助理控制台</h1>
<div class="desc">飞书助理平台运营面：租户总览 / 角色管理 / 聊天审计 · 数据源 daren_bot admin 只读接口 · 仅管理员可见</div>

<div class="msg-box warn" id="authHint">未检测到登录态 —— 请先在主窗口登录系统，再刷新本页（与主站共用登录 token）。</div>
<div class="msg-box err" id="errBox"></div>

<section>
  <h2>租户总览<span class="subnote">飞书 AI 租户 = 一个绑定的飞书机器人应用</span></h2>
  <table id="tenantTable">
    <thead><tr>
      <th>租户</th><th>显示名</th><th>角色</th><th>绑定抖音号</th>
      <th class="r">余额</th><th class="r">30天消耗</th><th>在线</th><th class="r">操作</th>
    </tr></thead>
    <tbody></tbody>
  </table>
</section>

<section>
  <h2>角色管理<span class="subnote">人格模板 = 全体该角色租户的唯一来源 · 「训练沉淀」= 聊天即训练的纠正条数</span></h2>
  <div class="roles" id="roleCards"></div>
</section>

<section>
  <h2>聊天审计<span class="subnote">§118 收发双向落库（bot_chat_messages）· 新→旧 · 最多 500 条</span></h2>
  <div class="toolbar">
    <select id="chatTenant"><option value="">先加载租户…</option></select>
    <select id="chatLimit">
      <option value="50">50 条</option>
      <option value="100" selected>100 条</option>
      <option value="200">200 条</option>
    </select>
    <button id="chatBtn" onclick="loadChat()">加载聊天记录</button>
  </div>
  <div class="chat-list" id="chatList"><div class="msg-empty">选择租户后加载聊天记录</div></div>
</section>

<script>
const ROLE_NAMES = { daren: '达人助理', commerce: '商务助理', merchant: '商家助理' };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fmt = n => (n == null ? '-' : Number(n).toLocaleString());
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(Number(ts) * 1000);   // bot 侧 created_at 是秒
  if (isNaN(d.getTime())) return String(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function setErr(text) {
  const el = $('errBox');
  if (text) { el.textContent = text; el.classList.add('show'); }
  else { el.textContent = ''; el.classList.remove('show'); }
}
function authHeaders() {
  const t = localStorage.getItem('sb_auth_token') || '';
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}
async function api(path) {
  const resp = await fetch(path, { headers: authHeaders() });
  if (resp.status === 401 || resp.status === 403) {
    throw new Error(resp.status === 401 ? '登录态无效，请回主窗口重新登录' : '需要管理员权限');
  }
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

let TENANTS = [];

async function loadConsole() {
  setErr('');
  if (!localStorage.getItem('sb_auth_token')) { $('authHint').classList.add('show'); return; }
  $('authHint').classList.remove('show');
  try {
    const data = await api('/api/feishu/console');
    TENANTS = data.tenants || [];
    renderTenants(TENANTS);
    renderRoles(data.roles || []);
    fillTenantSelect(TENANTS);
  } catch (e) { setErr(e.message || String(e)); }
}

function renderTenants(list) {
  const tbody = $('tenantTable').querySelector('tbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td class="empty" colspan="8">暂无飞书 AI 租户（或 daren_bot 不可达）</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(t => {
    const roleName = ROLE_NAMES[t.role] || esc(t.role) || '<span style="color:var(--sub)">未标注</span>';
    const online = t.ws_online
      ? '<span class="pill on">在线</span>'
      : '<span class="pill gray">离线</span>';
    return `<tr>
      <td>${esc(t.tenant_key)}</td>
      <td>${esc(t.tenant_label || t.tenant_key)}</td>
      <td>${roleName}</td>
      <td>${esc(t.douyin_id) || '<span style="color:var(--sub)">未绑定</span>'}</td>
      <td class="r bal">${fmt(t.balance)}</td>
      <td class="r">${fmt(t.usage30d)}</td>
      <td>${online}</td>
      <td class="r"><button onclick="recharge('${esc(t.tenant_key)}')">充值</button></td>
    </tr>`;
  }).join('');
}

function renderRoles(roles) {
  $('roleCards').innerHTML = roles.map(r => {
    const badge = r.enabled
      ? '<span class="pill on">启用中</span>'
      : '<span class="pill off">未启用</span>';
    const meta = r.enabled
      ? `模板版本：${esc(r.updated_at || '-') }<br>训练沉淀：${r.corrections} 条纠正`
      : esc(r.note || '未启用');
    return `<div class="role-card">
      <div class="name">${esc(r.label)}${badge}</div>
      <div class="meta">${meta}</div>
    </div>`;
  }).join('');
}

function fillTenantSelect(list) {
  $('chatTenant').innerHTML = list.length
    ? list.map(t => `<option value="${esc(t.tenant_key)}">${esc(t.tenant_label || t.tenant_key)}（${esc(t.tenant_key)}）</option>`).join('')
    : '<option value="">暂无租户</option>';
}

async function recharge(tk) {
  const amount = prompt(`给租户 ${tk} 充值积分：`, '500');
  if (amount == null) return;
  const n = parseInt(amount, 10);
  if (!n || n <= 0) { setErr('充值数必须是正整数'); return; }
  setErr('');
  try {
    const resp = await fetch('/api/credits/feishu/recharge', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ tenant: tk, amount: n })
    });
    const obj = await resp.json();
    if (!resp.ok) throw new Error(obj.error || `HTTP ${resp.status}`);
    await loadConsole();
  } catch (e) { setErr('充值失败：' + (e.message || String(e))); }
}

async function loadChat() {
  const tk = $('chatTenant').value;
  if (!tk) { setErr('先选择租户'); return; }
  setErr('');
  $('chatBtn').disabled = true;
  try {
    const data = await api(`/api/feishu/chat?tenant_key=${encodeURIComponent(tk)}&limit=${$('chatLimit').value}`);
    const msgs = (data.messages || []).slice().reverse();   // 落库是新→旧，气泡要旧→新
    const box = $('chatList');
    if (!msgs.length) {
      box.innerHTML = '<div class="msg-empty">该租户暂无聊天记录（§118 起新消息才落库）</div>';
      return;
    }
    box.innerHTML = msgs.map(m => {
      const cls = m.direction === 'in' ? 'in' : 'out';
      const who = m.direction === 'in' ? '达人' : 'AI';
      const mtype = m.msg_type && m.msg_type !== 'text' ? `<span class="mtype">[${esc(m.msg_type)}]</span>` : '';
      return `<div class="msg ${cls}">${mtype}${esc(m.content)}<span class="time">${who} · ${fmtTime(m.created_at)}</span></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    $('chatList').innerHTML = `<div class="msg-empty">${esc(e.message || String(e))}</div>`;
  } finally {
    $('chatBtn').disabled = false;
  }
}

loadConsole();
</script>
</body>
</html>
