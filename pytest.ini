[pytest]
# ★ fix/mini-test-code-repair-20260925: pytest 收集配置 (P2-1c)
# 之前用 *_test.py 后缀风格, dev 上 11 个文件被 .gitignore 忽略, 导致 82 case 跑不到.
# P2-1b 改名后用 test_*.py 前缀风格, 配合 P2-1a 删 .gitignore test_*.py 规则, 全可收集.

# 收集匹配 test_*.py 前缀文件
python_files = test_*.py

# 收集匹配 Test* 类
python_classes = Test*

# 收集匹配 test_* 函数
python_functions = test_*

# 默认 testpaths = tests (不污染根目录)
testpaths = tests

# 输出选项
addopts = -v --tb=short

# 标记 (老大 brief 提的"不用 --ignore / skip / xfail"): 不在这里配 strict, 由代码层维护
