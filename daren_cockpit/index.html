<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>达人经营驾驶舱</title>
<!-- PWA：达人"添加到主屏幕"即得类小程序入口（iOS 用 apple-* 系，Android 走 manifest）。
     故意不做 service worker——避免缓存壳把旧版 index.html 钉在用户手机上 -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#07c160">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="达人工作台">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"></script>
<script>if(typeof echarts==='undefined'){document.write('<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"><\/script>')}</script>
<style>
  :root{
    --bg:#ededed; --card:#ffffff; --line:#f0f0f0;
    --txt:#191919; --sub:#888888;
    --green:#07c160; --green-dk:#05914d; --green-bg:#e8f8ef;
    --amber:#fa9d3b; --red:#fa5151;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0}
  .card{background:var(--card);border-radius:16px}
  .kpi-num{font-size:30px;font-weight:700;letter-spacing:.3px;font-variant-numeric:tabular-nums}
  .tag{font-size:12px;padding:3px 10px;border-radius:8px;font-weight:500;white-space:nowrap}
  .sec-title{font-size:16px;font-weight:600}
  .sub{color:var(--sub);font-size:12px}
  .btn-green{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;font-size:13px;font-weight:600;padding:9px 18px;border-radius:999px;box-shadow:0 2px 8px rgba(7,193,96,.3);text-decoration:none}
  .hairline{height:1px;background:var(--line)}
  .v-能带{background:var(--green-bg);color:var(--green-dk)}
  .v-慎带{background:#fdf3e7;color:var(--amber)}
  .v-别带{background:#feecec;color:var(--red)}
  /* 达人评级色（潜力型/成长型/稳健型/成熟型/风险型）—— 与飞书 Base「评估结论」
     选项 hue 严格一一对应：潜力型=Green 成长型=Lime 稳健型/成熟型=Yellow 风险型=Red。
     ⚠️ 同一句话必须同色，否则两边像两个系统（2026-10-22 老大反馈）。 */
  .v-潜力型{background:var(--green-bg);color:var(--green-dk)}
  .v-成长型{background:var(--green-bg);color:var(--green-dk)}
  .v-稳健型{background:#fdf3e7;color:var(--amber)}
  .v-成熟型{background:#fdf3e7;color:var(--amber)}
  .v-风险型{background:#feecec;color:var(--red)}
  .v-评估中{background:#f2f2f2;color:#999}
  /* 品牌头：与飞书 App 顶栏同名（达人经营驾驶舱），两个入口一眼看出是同一套系统 */
  .brand-dot{width:8px;height:8px;border-radius:99px;background:var(--green);flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(7,193,96,.16)}
  .brand-name{font-size:14px;font-weight:700;color:var(--txt);letter-spacing:.2px;white-space:nowrap}
  .st-待评估{background:#fdf3e7;color:var(--amber)}
  .st-有意向{background:#e8f0fe;color:#2f6fed}
  .st-已合作{background:var(--green-bg);color:var(--green-dk)}
  .st-不合适{background:#f2f2f2;color:#999}
  .empty{border:1px dashed #ddd;border-radius:12px;padding:18px;text-align:center}
  /* AI 选品建议（2026-10-24）：推理链三段式 —— 画像 / 策略 / 推荐 */
  .reco-profile{background:var(--green-bg);color:var(--green-dk);border-radius:10px;
    padding:9px 12px;font-size:13px;line-height:1.6;margin-bottom:10px}
  .reco-strats{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
  @media(min-width:640px){.reco-strats{grid-template-columns:1fr 1fr 1fr}}
  .reco-strat{background:#fafafa;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .reco-items{display:grid;grid-template-columns:1fr;gap:8px}
  @media(min-width:640px){.reco-items{grid-template-columns:1fr 1fr}}
  .reco-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
  .spinner{width:26px;height:26px;border:3px solid #e6e6e6;border-top-color:#07c160;border-radius:50%;margin:6px auto;animation:kc-spin .8s linear infinite}
  @keyframes kc-spin{to{transform:rotate(360deg)}}
  /* 图表行布局不依赖 Tailwind CDN（避免与 echarts 初始化竞态），写死自带样式 */
  .charts2{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:640px){.charts2{grid-template-columns:1fr 1fr}}
  /* 多角色工作台 */
  .band-优质{background:var(--green-bg);color:var(--green-dk)}
  .band-良好{background:#e8f0fe;color:#2f6fed}
  .band-待观察{background:#fdf3e7;color:var(--amber)}
  .band-未评估{background:#f2f2f2;color:#999}
  .band-bar-优质{background:var(--green)}
  .band-bar-良好{background:#2f6fed}
  .band-bar-待观察{background:var(--amber)}
  .band-bar-未评估{background:#b2b2b2}
  .role-card{transition:transform .15s ease,box-shadow .15s ease;cursor:pointer;display:block;text-decoration:none;color:inherit}
  .role-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.07)}
  .talent-card{display:block;text-decoration:none;color:inherit;border-top:4px solid transparent}
  .tc-优质{border-top-color:var(--green)} .tc-良好{border-top-color:#2f6fed}
  .tc-待观察{border-top-color:var(--amber)} .tc-未评估{border-top-color:#b2b2b2}
  /* 商品推荐：今日精选网格 + 历史折叠区 */
  /* ⚠️ grid 列必须写 minmax(0,1fr) 而不是 1fr：1fr 的最小尺寸是 min-content，
     商品名一长就把列撑破（手机端横向溢出 22px）。minmax(0,1fr) 才是真·可压缩。 */
  .pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  @media(min-width:560px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .pcard{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:12px;
    display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
  .pcard .pn{font-size:14px;font-weight:600;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pmore{border:1px solid var(--line);border-radius:12px;margin-top:10px;background:#fafafa}
  .pmore>summary{cursor:pointer;padding:12px 14px;font-size:14px;font-weight:600;
    list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pmore>summary::-webkit-details-marker{display:none}
  .pmore .pbody{padding:0 12px 12px}
  .pmore .pitem{border-top:1px solid var(--line);padding:10px 2px;min-width:0;overflow-wrap:anywhere}
  .pmore .pitem:first-child{border-top:0}
  .swatch{font-size:12px;padding:3px 10px;border-radius:8px;font-weight:500;white-space:nowrap}
  /* 长文本（合作说明/商品名）必须能断行，否则手机端把整页撑出横向滚动条 */
  .break{overflow-wrap:anywhere;word-break:break-word;min-width:0}
  /* 排品表（2026-10-24）：日期条 + 坑位卡
     ⚠️ 网格列用 minmax(0,1fr) —— 同 .pgrid 的坑，商品名一长就横向溢出 */
  .plan-day{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;
    padding:10px 0;border-top:1px solid var(--line)}
  .plan-day:first-child{border-top:0}
  .plan-date{text-align:center;border-radius:10px;background:#fafafa;border:1px solid var(--line);
    padding:6px 2px;align-self:start}
  .plan-date .pd-d{font-size:17px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .plan-date .pd-w{font-size:10px;color:var(--sub);margin-top:1px}
  .plan-today .plan-date{background:var(--green-bg);border-color:rgba(7,193,96,.35)}
  .plan-today .plan-date .pd-d{color:var(--green-dk)}
  .plan-today .plan-date .pd-w{color:var(--green-dk);font-weight:600}
  .plan-slot{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fafafa;margin-bottom:7px}
  .plan-slot:last-child{margin-bottom:0}
  .plan-today .plan-slot{background:var(--card);border-color:rgba(7,193,96,.3)}
  .plan-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .plan-no{font-size:10px;font-weight:700;color:#fff;background:var(--green);border-radius:5px;padding:1px 6px;flex:none}
  .plan-name{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
  .plan-prio{font-size:12px;color:var(--amber);flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
  .plan-meta{font-size:11.5px;color:var(--sub);margin-top:4px}
  .plan-why{margin:5px 0 0;padding-left:16px;font-size:11.5px;color:var(--sub)}
  .plan-why li{margin:1px 0}
  .plan-empty{text-align:center;color:var(--sub);font-size:12.5px;padding:10px 0 2px}
</style>
</head>
<body>
<div class="max-w-[760px] mx-auto p-3 space-y-3 pb-8" id="app">
  <div class="card p-6 text-center"><div class="spinner"></div><div class="sub mt-2">数据加载中…</div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 粉丝量按「万」单位（老大 2026-10-22 定调：1.3万 好看）。
   ⚠️ 必须与 daren_bot/fmt.py 的 fmt_wan() 逐位一致 —— 算式、舍入方向、阈值全同。
      跨语言一致性由 tests/test_fmt_consistency.py 锁住，别单独改一边。
   规则：<1万 → 千分位原值；≥1万 → X.X万（整数不带小数）。 */
function fmtFans(v){
  const x = Number(v);
  if (v === null || v === undefined || !isFinite(x)) return '—';
  if (Math.abs(x) < 10000) return (x >= 0 ? Math.round(x) : -Math.round(-x)).toLocaleString();
  const w = (x >= 0 ? Math.floor(x/10000*10 + 0.5) : -Math.floor(-x/10000*10 + 0.5)) / 10;
  return (Number.isInteger(w) ? String(w) : w.toFixed(1)) + '万';
}
/* 结论 → emoji。与飞书 Base 单选字段的选项 hue 同源（同一句话同一个颜色）：
   能带/潜力型/成长型=🟢绿  慎带/稳健型/成熟型=🟡琥珀  别带/风险型=🔴红。
   ⚠️ 改这里必须同步改飞书 Base「商品推荐记录·结论」和「账号档案·评估结论」的
      options.hue，否则 H5 和飞书 App 又变成两个系统。 */
const VERDICT_EMOJI = {
  '能带':'🟢','潜力型':'🟢','成长型':'🟢',
  '慎带':'🟡','稳健型':'🟡','成熟型':'🟡',
  '别带':'🔴','风险型':'🔴',
};
function verdictEmoji(v){ return VERDICT_EMOJI[v] || '⚪'; }
/* 飞书字段原值 → 结论裸词：商品推荐记录·结论 的选项名带 emoji 前缀（「🟢 能带」），
   账号档案·评估结论 是裸词（「潜力型」）。拼 .v-* CSS 类名前必须剥掉前缀 ——
   否则会拼出 v-🟢 能带 这种不存在的类 → 结论标签掉底色（2026-10-22 实测发现）。
   ⚠️ 与 daren_bot/verdict_ui.py 的 verdict_key() 保持一致（守卫脚本对拍）。 */
function verdictKey(v){
  let out = '';
  for(const ch of String(v || '')){
    if(/[0-9A-Za-z一-鿿]/.test(ch)) out += ch;
  }
  return out;
}
const COOP_FORM = 'https://my.feishu.cn/share/base/shrcntWrz2k7Vx4REmvGW0yLttf';
/* ★ 招商减负版入口：商家只填 2 项 + （链接|图片|描述）任一，AI 自动补商品字段。
   飞书分享表单（COOP_FORM）保留为「填完整表」备选，不再是默认入口。 */
const COOP_APPLY = '/apply';

/* 运营 key：admin 页首次访问输入，存 sessionStorage，所有请求带头 */
const getOpsKey = () => sessionStorage.getItem('opskey') || '';
function opsHeaders(){ const h = {}; if(getOpsKey()) h['x-ops-key'] = getOpsKey(); return h; }

async function boot(){
  const p = new URLSearchParams(location.search);
  const view = p.get('view');
  const t = p.get('t');
  if(view === 'admin') return bootAdmin();
  if(!t) return renderLanding();
  let d;
  try{
    const k = p.get('k') || '';
    const r = await fetch('/api/cockpit?t=' + encodeURIComponent(t)
                          + (k ? '&k=' + encodeURIComponent(k) : ''),
                          {headers: opsHeaders()});
    d = await r.json();
    if(!r.ok) throw new Error(d.error || r.status);
  }catch(e){
    // ⚠️ 2026-10-22：老大手机点收藏的旧专属链接 → 403。原提示是「无权访问 + 让用户
    //    从飞书机器人推送的链接进入」—— 他明明就是从飞书拿的链接，这句话等于没回答
    //    他的问题。真实原因通常是**专属链接已过期**（key 轮换过，防泄漏），
    //    所以要说人话、指向下一步动作。
    //    ⚠️ 幽灵租户和错 key 走同一条分支、同一句文案 → 不泄露租户是否存在。
    const msg = e.message === 'unauthorized'
      ? '链接无效或已过期。专属链接会定期更换(安全原因),请向运营老师要一下最新的链接。'
      : e.message;
    $('#app').innerHTML = `<div class="card p-6 text-center"><div class="font-bold mb-1">打不开这个链接</div><div class="sub">${esc(msg)}</div></div>`;
    return;
  }
  render(d);
  // 等 Tailwind CDN 把动态注入的类名样式生成完再量尺寸，避免 canvas 定格在错误宽度
  setTimeout(() => drawCharts(d), 350);
}

/* ---------- 多角色入口（学千家工作台：选身份进入，各看各的） ---------- */
function renderLanding(){
  document.title = '达人经营驾驶舱';
  const roles = [
    {href:'?view=admin', icon:'📊', title:'运营工作台', who:'管理员 · 品牌方视角',
     perms:['全部达人名单与评分分布','合作机会管道跟进','每位达人点进去看详细驾驶舱']},
    {href:'', icon:'🧑‍🎤', title:'达人驾驶舱', who:'达人本人视角',
     perms:['自己的粉丝 / GMV / 选品结论','每周采集自动更新','招商合作机会直达'],
     note:'入口在飞书机器人推送的专属链接里，一人一链'},
    {href:COOP_APPLY, icon:'🤝', title:'招商合作', who:'品牌 / 供应商视角',
     perms:['2 项必填，商品信息 AI 自动识别','商品链接 / 图片 / 一句话都行','提交后运营评估并匹配给合适达人']},
  ];
  $('#app').innerHTML = `
  <div class="card p-6 text-center mt-4">
    <div class="text-2xl font-bold">达人经营驾驶舱</div>
    <div class="sub mt-2">选一个身份进入 · 不同身份看到的数据不一样</div>
  </div>
  <div class="grid gap-3" style="grid-template-columns:1fr">
    ${roles.map(r => r.href ? `
    <a class="card role-card p-5" href="${r.href}"${r.href.startsWith('http')?' target="_blank"':''}>
      ${roleCardInner(r)}
      <div class="mt-3 text-sm font-semibold" style="color:var(--green-dk)">以此身份进入 →</div>
    </a>` : `
    <div class="card role-card p-5">
      ${roleCardInner(r)}
      <div class="mt-3 text-sm font-semibold sub">${esc(r.note)}</div>
    </div>`).join('')}
  </div>
  <div class="sub text-center pt-1">内测版 · 数据来自我们系统采集与评估，每周一更新</div>`;
}

function roleCardInner(r){
  return `
      <div class="flex items-center gap-3 mb-3">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center text-xl" style="background:var(--green-bg)">${r.icon}</div>
        <div><div class="font-bold">${r.title}</div>
        <div class="sub">${r.who}</div></div>
      </div>
      ${r.perms.map(p => `<div class="text-sm mb-1" style="color:#555">✓ ${p}</div>`).join('')}`;
}

/* ---------- 运营工作台 ---------- */
function renderOpsGate(msg){
  document.title = '运营工作台 · 达人经营驾驶舱';
  $('#app').innerHTML = `
  <div class="card p-6 mt-4">
    <div class="font-bold mb-1">🔐 运营工作台需要访问口令</div>
    <div class="sub mb-3">${esc(msg || '输入 ops key 进入。首次启动时服务端日志里打印过。')}</div>
    <input id="opskey-in" type="password" class="w-full p-2 mb-3" style="border:1px solid #ddd;border-radius:8px"
           placeholder="ops key" onkeydown="if(event.key==='Enter')saveOpsKey()">
    <button class="btn-green" onclick="saveOpsKey()">进入</button>
  </div>`;
}
function saveOpsKey(){
  sessionStorage.setItem('opskey', $('#opskey-in').value.trim());
  bootAdmin();
}

async function bootAdmin(){
  document.title = '运营工作台 · 达人经营驾驶舱';
  if(!getOpsKey()) return renderOpsGate();
  let d;
  try{
    const r = await fetch('/api/roster', {headers: opsHeaders()});
    d = await r.json();
    if(!r.ok) throw new Error(d.error || r.status);
  }catch(e){
    if(e.message === 'unauthorized'){
      sessionStorage.removeItem('opskey');
      return renderOpsGate('口令不对，请重试');
    }
    $('#app').innerHTML = `<div class="card p-6 text-center"><div class="font-bold mb-1">出错了</div><div class="sub">${esc(e.message)}</div></div>`;
    return;
  }
  renderAdmin(d);
  setTimeout(() => drawAdminDonut(d), 350);
}

function renderAdmin(d){
  const k = d.kpi || {};
  const bandOrder = ['优质','良好','待观察','未评估'];
  const talents = (d.tenants || []).slice().sort((a,b) => b.fans - a.fans);
  const talentCards = talents.map(t => `
    <a class="card talent-card tc-${esc(t.band)} p-4 mb-3" href="?t=${encodeURIComponent(t.tenant)}">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <span class="font-bold">${esc(t.name)}</span>
        <span class="tag band-${esc(t.band)}">${esc(t.band)}${t.score >= 0 ? ' · ' + t.score + '分' : ''}</span>
      </div>
      <div class="sub mt-1">抖音号 ${esc(t.dyid)} · 入驻 ${esc(t.joined)}</div>
      <div class="grid grid-cols-3 gap-2 mt-3 text-center">
        <div><div class="font-bold">${fmtFans(t.fans)}</div><div class="sub">粉丝</div></div>
        <div><div class="font-bold" style="font-size:13px">${esc(t.gmv_text)}</div><div class="sub">60天GMV</div></div>
        <div><div class="font-bold">${t.credits}</div><div class="sub">积分余额</div></div>
      </div>
      <div class="sub mt-2">最近采集 ${esc(t.updated)}</div>
    </a>`).join('') || `<div class="empty sub">暂无达人，机器人绑定后自动出现</div>`;

  const STATUSES = ['待评估', '有意向', '已合作', '不合适'];

  /* 商家提交（AI 识别）——本地表，飞书同步失败时运营也能看到 */
  const APPLY_ST = {pending:['待识别','#fdf3e7','#fa9d3b'], parsing:['识别中','#fdf3e7','#fa9d3b'],
    done:['已识别','#e8f8ef','#05914d'], partial:['部分识别','#fdf3e7','#fa9d3b'],

/* 合作状态流转：运营页改状态 → 写回飞书表 → 达人页 120s 缓存后同步可见 */
document.addEventListener('change', async e => {
  const sel = e.target.closest && e.target.closest('.coop-status');
  if(!sel) return;
  const msg = document.getElementById('coop-msg-' + sel.dataset.idx);
  msg.textContent = '保存中…'; msg.style.color = 'var(--sub)';
  try{
    const r = await fetch('/api/coop/status', {method:'POST',
      headers:{'Content-Type':'application/json', ...opsHeaders()},
      body: JSON.stringify({record_id: sel.dataset.rid, status: sel.value})});
    const d = await r.json();
    if(!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status));
    msg.textContent = '✓ 已同步'; msg.style.color = 'var(--green-dk)';
  }catch(err){
    msg.textContent = '✗ ' + err.message; msg.style.color = 'var(--red)';
  }
  setTimeout(() => { msg.textContent = ''; }, 4000);
});

window.addEventListener('resize', () => {

/* ---------- 商品推荐：今日精选 + 换一批 + 更多（不全量平铺） ----------
   ⚠️ 2026-10-21 老大反馈「商品一多就一直往下划」→ 改成分层：
     ① 今日推荐（今天的商品，网格 + 换一批）
     ② 更多推荐（历史，折叠收起，默认不展开）
   服务端 d.cards 已从「硬截 [:3] 平铺」改成全量返回。
   ⚠️ 必须留在**全局作用域**：按钮是 inline onclick= 调用的，函数藏在
     render() 里会变成"点了没反应"（inline handler 只查全局作用域）。 */
const _pState = {batch: 0};
const PAGE_SIZE = 4;
let _lastData = null;

function productCard(c){
  const vTag = c.verdict ? `<span class="swatch v-${esc(verdictKey(c.verdict))}">${esc(c.verdict)}</span>`
    : (c.score !== undefined ? `<span class="swatch" style="background:#f2f2f2;color:#666">匹配 ${c.score}</span>` : '');
  const meta = [c.price && '价格 ' + esc(c.price), c.comm && '佣金 ' + esc(c.comm),
    (c.sales !== '' && c.sales !== undefined && c.sales !== 0) && '销量 ' + esc(c.sales)].filter(Boolean).join(' · ');
  const img = c.image ? `<img src="${esc(c.image)}" alt="" style="width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:8px">` : '';
  return `<div class="pcard">
    ${img}
    <div class="flex items-start justify-between gap-1 mb-1">
      <span class="pn">${esc(c.name || '未命名商品')}</span>${vTag}
    </div>
    ${meta ? `<div class="sub mb-1">${meta}</div>` : ''}
    ${c.reason ? `<div class="sub" style="line-height:1.5">${esc(c.reason)}</div>` : ''}
    ${c.date ? `<div class="sub mt-1">${esc(c.date)}</div>` : ''}
  </div>`;
}

function drawProducts(d){
  const zone = document.getElementById('prodZone');
  if(!zone) return;
  const all = (d.cards || []).slice();
  if(!all.length){ zone.innerHTML = `<div class="empty sub">暂无推荐，采集后自动生成</div>`; return; }
  const today = all.filter(c => c.is_today);
  const rest  = all.filter(c => !c.is_today);
  const pool  = today.length ? today : all.slice(0, 3);
  const pages = Math.max(1, Math.ceil(pool.length / PAGE_SIZE));
  const b = Math.min(_pState.batch, pages - 1);
  const slice = pool.slice(b * PAGE_SIZE, b * PAGE_SIZE + PAGE_SIZE);
  const lastDate = (all.find(c => c.date) || {}).date || '';
  const head = today.length
    ? `<div class="flex items-baseline justify-between flex-wrap gap-1 mb-3">
         <div class="sec-title">今日推荐</div>
         <div class="sub">${today.length} 件新推荐</div>
       </div>`
    : `<div class="flex items-baseline justify-between flex-wrap gap-1 mb-3">
         <div class="sec-title">最近推荐</div>
         <div class="sub">今天还没有新推荐 · 最近一次 ${esc(lastDate)}</div>
       </div>`;
  const switcher = pages > 1
    ? `<div class="flex items-center justify-between mt-3">
         <button class="sub" style="background:none;border:0;color:var(--green-dk);padding:0" onclick="switchProductBatch(-1)">‹ 上一批</button>
         <span class="sub">第 ${b+1}/${pages} 批</span>
         <button class="sub" style="background:none;border:0;color:var(--green-dk);padding:0" onclick="switchProductBatch(1)">换一批 ›</button>
       </div>` : '';
  const more = rest.length ? `
    <details class="pmore">
      <summary><span>更多推荐</span><span class="sub">${rest.length} 件历史</span></summary>
      <div class="pbody">
        ${rest.map(c => `<div class="pitem">
          <div class="flex items-start justify-between gap-2">
            <span class="pn" style="font-size:13px">${esc(c.name || '未命名商品')}</span>
            ${c.verdict ? `<span class="swatch v-${esc(verdictKey(c.verdict))}">${esc(c.verdict)}</span>` : ''}
          </div>
          <div class="sub mt-1">${[c.price && esc(c.price), c.comm && ('佣金 ' + esc(c.comm)), c.date && esc(c.date)].filter(Boolean).join(' · ')}</div>
          ${c.reason ? `<div class="sub mt-1">${esc(c.reason)}</div>` : ''}
        </div>`).join('')}
      </div>
    </details>` : '';
  zone.innerHTML = head + `<div class="pgrid">${slice.map(productCard).join('')}</div>` + switcher + more;
}

function switchProductBatch(delta){
  _pState.batch = Math.max(0, _pState.batch + delta);
  if(_lastData) drawProducts(_lastData);
}

/* ── AI 选品建议：粉丝画像 → 类目策略 → 商品推荐（推荐指数★） ──
   ★ 达人端那个 ★ 是 AI 助手自己算的；这里是我方评分器算的（口径写在 notes 里）。 */
function starsHtml(n){
  const s = Math.max(1, Math.min(5, n||0));
  return `<span style="color:var(--amber);letter-spacing:1px;white-space:nowrap">${'★'.repeat(s)}<span style="color:#dcdcdc">${'☆'.repeat(5-s)}</span></span>`;
}
function recoSection(d){
  const r = (d && d.reco) || {};
  const p = r.profile || {};
  const recs = r.recommendations || [];
  if(!p.name && !recs.length) return '';
  const bits = [];
  const gd = p.gender_dist || {};
  const topG = Object.entries(gd).sort((a,b)=>b[1]-a[1])[0];
  if(topG) bits.push('粉丝' + esc(topG[0]) + ' ' + Math.round(topG[1]) + '%');
  const ad = p.age_dist || {};
  const topA = Object.entries(ad).sort((a,b)=>b[1]-a[1])[0];
  if(topA) bits.push(esc(topA[0]) + '岁为主');
  if(p.price_center) bits.push('客单价约 ¥' + esc(p.price_center));
  if((p.categories||[]).length) bits.push('类目 ' + esc(p.categories.slice(0,2).join('、')));
  const strat = (r.strategies||[]).map(s => `
    <div class="reco-strat">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <span class="font-semibold text-sm">${esc(s.name)}</span>
        <span class="sub">价带 ¥${esc(s.price_lo)}~¥${esc(s.price_hi)}</span>
      </div>
      <div class="sub mt-1">${esc(s.rationale||'')}</div>
    </div>`).join('');
  const items = recs.map(x => `
    <div class="reco-item">
      <div class="flex items-start justify-between gap-2">
        <span class="pn text-sm">${esc(x.name)}</span>
        <span class="shrink-0">${starsHtml(x.stars)}</span>
      </div>
      <div class="sub mt-1">¥${esc(x.price)} · ${esc(x.score)}分 · ${esc(x.strategy)}</div>
      ${(x.reasons||[]).length ? `<div class="sub mt-1">${esc(x.reasons.slice(0,2).join(' · '))}</div>` : ''}
      ${(x.missing_dims||[]).length ? `<div class="sub mt-1">缺：${esc(x.missing_dims.join('、'))}</div>` : ''}
    </div>`).join('');
  const notes = (r.notes||[]).map(n => `<div class="sub mt-1">· ${esc(n)}</div>`).join('');
  return `
  <div class="card p-5">
    <div class="flex items-baseline justify-between mb-1 flex-wrap gap-1">
      <div class="sec-title">AI 选品建议</div>
      <div class="sub">画像 → 策略 → 商品 · 推荐指数我方自算</div>
    </div>
    <div class="reco-profile">${bits.length ? bits.join(' · ') : '画像数据不足，暂不生成策略'}</div>
    ${strat ? `<div class="reco-strats">${strat}</div>` : ''}
    ${items ? `<div class="reco-items">${items}</div>` : '<div class="empty sub">没有匹配到可推商品</div>'}
    ${notes}
  </div>`;
}

function planSection(d){
  /* 排品表（2026-10-24）
     ★ 数据来自 /api/cockpit 里的 plan 字段（后端算好，和机器人侧同一份算法）
     ★ 排品池 = 我们系统里的合作单（运营建单 / 达人「接了 xxx」/ 合作申请通过）
  */
  const p = d.plan || {};
  const slots = p.slots || [];
  if(!slots.length){
    return `<div class="card p-5">
      <div class="sec-title mb-1">排品表</div>
      <div class="sub mb-3">AI 按「匹配度 + 佣金 + 时机」排好哪天推哪个</div>
      <div class="empty sub">还没有接品 · 运营在后台建合作单、或达人发「接了 &lt;商品ID&gt;」后，这里会出现 7 天安排</div>
    </div>`;
  }
  const today = new Date().toISOString().slice(0,10);
  const WD = ['周日','周一','周二','周三','周四','周五','周六'];
  const body = slots.map(s => {
    const isToday = s.date === today;
    const dstr = new Date(s.date + 'T00:00:00');
    const wd = isNaN(dstr) ? '' : (WD[dstr.getDay()] || '');
    const items = (s.items || []).map(it => {
      const stars = '★'.repeat(Math.max(1, Math.round((it.priority||0)/20)));
      const meta = [
        it.price ? '¥' + Number(it.price).toFixed(0) : '',
        it.commission_rate ? '佣金' + Number(it.commission_rate).toFixed(0) + '%' : '',
        it.lifecycle && it.lifecycle.label ? it.lifecycle.label : '',
      ].filter(Boolean).join(' · ');
      const why = (it.reasons || []).slice(0,2).map(r => `<li>${esc(r)}</li>`).join('');
      return `<div class="plan-slot">
        <div class="plan-top">
          <span class="plan-no">坑位 ${it.plan_slot}</span>
          <span class="plan-name">${esc(it.product_name || '')}</span>
          <span class="plan-prio">${stars} ${(it.priority||0).toFixed(1)}</span>
        </div>
        <div class="plan-meta">${esc(meta)}</div>
        ${why ? `<ul class="plan-why">${why}</ul>` : ''}
      </div>`;
    }).join('') || `<div class="plan-empty">空坑位 · 等新商品进来自动补上</div>`;
    return `<div class="plan-day ${isToday ? 'plan-today' : ''}">
      <div class="plan-date">
        <div class="pd-d">${esc(s.date.slice(5))}</div>
        <div class="pd-w">${esc(isToday ? '今天' : wd)}</div>
      </div>
      <div>${items}</div>
    </div>`;
  }).join('');
  const filled = slots.reduce((n,s) => n + (s.items||[]).length, 0);
  return `<div class="card p-5">
    <div class="flex items-baseline justify-between mb-1 flex-wrap gap-1">
      <div class="sec-title">排品表</div>
      <div class="sub">${filled} 个品 · ${slots.length} 天 · 每天 ${p.per_day || 2} 坑</div>
    </div>
    <div class="sub mb-3">AI 排好哪天推哪个 · 同品类不排相邻两天 · 每天 09:37 在飞书提醒达人</div>
    ${body}
  </div>`;
}

      <span class="brand-dot"></span>
      <span class="brand-name">达人经营驾驶舱</span>
      <span class="sub">· 达人视图</span>
    </div>
    <a href="/" class="sub shrink-0" style="text-decoration:none">‹ 换身份</a>
  </div>
  <!-- 账号卡 -->
  <div class="card p-5">
    <div class="flex items-center gap-4">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-xl font-bold text-white shrink-0" style="background:linear-gradient(135deg,#07c160,#3dd68c)">${esc((d.name||'达')[0])}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xl font-bold">${esc(d.name)}</span>
          <span class="tag v-${esc(d.verdict)}">${verdictEmoji(d.verdict)} ${esc(d.verdict)}</span>
        </div>
        <div class="sub mt-1">抖音号 ${esc(d.dyid)} · 数据来自我们系统 · ${esc(d.updated)} 更新</div>
      </div>
    </div>
    <div class="hairline my-4"></div>
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <div><div class="sub mb-1">本周一句话</div>
        <div class="font-semibold" style="color:var(--green-dk)">${esc(d.verdict_line)}</div></div>
      <a class="btn-green" href="${COOP_APPLY}">📮 提交合作意向</a>
    </div>
  </div>

  <!-- KPI -->
  <div class="grid grid-cols-2 gap-3">
    <div class="card p-4"><div class="sub mb-1">粉丝总量</div>
      <div class="kpi-num">${fmtFans(d.fans)}</div>
      <div class="sub mt-1">${delta}</div></div>
    <div class="card p-4"><div class="sub mb-1">累计带货 GMV</div>
      <div class="kpi-num" style="color:var(--green-dk)">${esc(d.gmv_text)}</div>
      <div class="sub mt-1">${d.gmv_range ? '档位 ' + esc(d.gmv_range) : '近 60 天窗口 · 平台档位口径'}</div></div>
    <div class="card p-4"><div class="sub mb-1">推荐商品</div>
      <div class="kpi-num">${d.cards.length}<span class="text-base" style="color:var(--sub)"> 件</span></div>
      <div class="sub mt-1" id="verdict-mini"></div></div>
    <div class="card p-4"><div class="sub mb-1">视频带货占比</div>
      <div class="kpi-num">${esc(d.video_ratio)}</div>
      <div class="sub mt-1">${esc(d.video_note)}</div></div>
  </div>

  <!-- 趋势 -->
  <div class="card p-5">
    <div class="flex items-baseline justify-between mb-1 flex-wrap gap-1">
      <div class="sec-title">粉丝趋势</div>
      <div class="sub">${esc(d.trend_note)} · 攒满 4 周出完整趋势</div>
    </div>
    <div id="trend" style="height:190px"></div>
  </div>

  <!-- 结论+互动 -->
  <div class="charts2">
    <div class="card p-5"><div class="sec-title mb-1">评估结论</div>
      <div class="sub mb-1">按采集记录</div><div id="verdict" style="height:170px"></div></div>
    <div class="card p-5"><div class="sec-title mb-1">AI 互动</div>
      <div class="sub mb-1">共 ${interTotal} 次</div><div id="interact" style="height:170px"></div></div>
  </div>

  <!-- 选品 -->
  <div class="card p-5">
    <div class="flex items-baseline justify-between mb-4 flex-wrap gap-1">
      <div class="sec-title">商品推荐</div>
      <div class="sub">今天的优先 · 历史收在「更多推荐」里</div>
    </div>
    <div id="prodZone"></div>
  </div>

  <!-- AI 选品建议（推理链） -->
  ${recoSection(d)}

  <!-- 排品表（AI 排好哪天推哪个） -->
  ${planSection(d)}

  <!-- 合作 -->
  <div class="card p-5">
    <div class="sec-title mb-3">合作机会</div>
    ${coop}
    ${coopMore}
  </div>

  <div class="sub text-center pt-1">口径声明：GMV 为近 60 天窗口的平台档位中值（区间见卡片副行），粉丝为采集时点值；结论仅供参考，选品以最新周报为准。</div>`;

  // 绿黄红 mini 统计
  const vc = {};
  (d.cards||[]).forEach(c => { if(c.verdict) vc[c.verdict] = (vc[c.verdict]||0)+1; });
  const el = $('#verdict-mini');
  if(el) el.innerHTML = ['能带','慎带','别带'].map(v =>
    `<span style="color:${v==='能带'?'var(--green-dk)':v==='慎带'?'var(--amber)':'var(--red)'}">${v} ${vc[v]||0}</span>`).join(' · ');
  // 商品区分层渲染 + 缓存数据（换一批按钮要重画）
  _lastData = d;
  drawProducts(d);
}

let _charts = [];
function drawCharts(d){
  if(typeof echarts === 'undefined') return;
  _charts.forEach(c => c.dispose());
  _charts = [];
  const axis={axisLine:{lineStyle:{color:'#eee'}},axisLabel:{color:'#999',fontSize:11},splitLine:{lineStyle:{color:'#f5f5f5'}}};
  const base={textStyle:{color:'#191919'},tooltip:{trigger:'item',backgroundColor:'#fff',borderColor:'#eee',textStyle:{color:'#191919'},extraCssText:'box-shadow:0 4px 16px rgba(0,0,0,.08)'}};

  const t = d.trend || [];
  _charts.push(echarts.init($('#trend'))); _charts[0].setOption({...base,
    grid:{left:56,right:16,top:24,bottom:26},
    xAxis:{type:'category',data:t.map(x=>x.date.slice(5)),...axis},
    yAxis:{type:'value',scale:true,...axis},
    series:[{type:'line',data:t.map(x=>x.fans),smooth:true,symbolSize:8,
      lineStyle:{width:3,color:'#07c160'},itemStyle:{color:'#07c160'},
      areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(7,193,96,.18)'},{offset:1,color:'rgba(7,193,96,0)'}]}},
      label:{show:t.length<=4,color:'#05914d',fontSize:11}}]});

  _charts.push(echarts.init($('#verdict'))); _charts[1].setOption({...base,
    tooltip:{...base.tooltip,formatter:'{b}: {c} 次 ({d}%)'},
    series:[{type:'pie',radius:['62%','85%'],center:['50%','52%'],
      itemStyle:{borderColor:'#fff',borderWidth:3},
      label:{color:'#888',fontSize:11,formatter:'{b}\n{c} 次'},
      data:[{value:1,name:'🟢 '+(d.verdict||'评估中'),itemStyle:{color:'#07c160'}}]}]});

  const it = d.interact || {};
  const keys = Object.keys(it);
  _charts.push(echarts.init($('#interact'))); _charts[2].setOption({...base,
    grid:{left:64,right:36,top:8,bottom:24},
    xAxis:{type:'value',...axis},
    yAxis:{type:'category',data:keys,...axis},
    series:[{type:'bar',barWidth:18,
      data:keys.map((k,i)=>({value:it[k],itemStyle:{color:i===0?'#07c160':'#b2b2b2'}})),
      itemStyle:{borderRadius:[0,9,9,0]},
      label:{show:true,position:'right',color:'#191919',fontSize:12}}]});
}

boot();
</script>
</body>
</html>
